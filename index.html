<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<title>Timer</title>
<meta name="theme-color" content="#0B0F14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#0B0F14;
  --panel:#151C24;
  --panel2:#1E2833;
  --line:#2A3745;
  --text:#F2F5F7;
  --dim:#8A9AAB;
  --green:#21C55D;
  --amber:#F59E0B;
  --cyan:#38BDF8;
  --red:#EF4444;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  user-select:none;-webkit-user-select:none;
  touch-action:manipulation;
  overscroll-behavior:none;
}
#app{
  height:100dvh;height:100vh;
  display:grid;
  grid-template-rows:auto auto 1fr auto;
  gap:10px;
  padding:calc(8px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));
}

/* ---------- header ---------- */
.head{display:flex;align-items:center;gap:8px;grid-row:1}
.tabs{display:flex;flex:1;background:var(--panel);border-radius:12px;padding:4px;gap:4px}
.tab{
  flex:1;border:0;background:transparent;color:var(--dim);
  font:700 clamp(13px,3.6vw,17px)/1 inherit;letter-spacing:.08em;
  padding:12px 4px;border-radius:9px;cursor:pointer;
}
.tab[aria-selected="true"]{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.tog{
  border:0;background:var(--panel);color:var(--dim);
  width:46px;height:46px;border-radius:12px;font-size:20px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
}
.tog[data-on="1"]{color:var(--cyan);background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line)}
.tog[data-on="1"] .off-only{display:none}
.tog[data-on="0"] .on-only{display:none}
.tog[data-on="0"]{color:#5A6B7C}

/* ---------- presets ---------- */
#presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;grid-row:2}
.preset{
  border:0;background:var(--panel);color:var(--text);
  font:700 clamp(16px,5.2vw,24px)/1 inherit;
  padding:clamp(12px,2.3vh,20px) 2px;border-radius:12px;cursor:pointer;
  box-shadow:inset 0 0 0 1px var(--line);
}
.preset[aria-pressed="true"]{background:var(--cyan);color:#04202e;box-shadow:none}
.preset.custom{font-size:clamp(13px,4.1vw,19px);letter-spacing:.04em}
#presets[data-locked="1"] .preset{opacity:.34}
#presets[data-locked="1"] .preset[aria-pressed="true"]{opacity:.75}

/* ---------- display ---------- */
.stage{
  grid-row:3;
  background:var(--panel);border-radius:18px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:0;position:relative;overflow:hidden;padding:8px;
}
.digits{
  font-family:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Consolas,monospace;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;
  font-weight:700;letter-spacing:-.02em;line-height:.95;
  font-size:min(33vw,29vh);
  transition:color .12s linear;
}
.digits{max-width:100%}
.label{
  font:600 clamp(11px,3vw,14px)/1 inherit;letter-spacing:.22em;color:var(--dim);
  margin-bottom:clamp(6px,1.4vh,14px);text-transform:uppercase;
}
.bar{position:absolute;left:0;bottom:0;height:8px;width:100%;background:#0d141b}
.bar > i{display:block;height:100%;width:100%;background:var(--green);transform-origin:left center}
.stage[data-state="warn"] .digits{color:var(--amber)}
.stage[data-state="warn"] .bar > i{background:var(--amber)}
.stage[data-state="done"] .digits{color:var(--red)}
.stage[data-state="done"] .bar > i{background:var(--red)}
.stage[data-state="paused"] .digits{color:var(--dim)}
.stage[data-state="done"]{animation:flash .55s steps(1,end) infinite}
@keyframes flash{0%{background:var(--panel)}50%{background:#3a1416}}
@media (prefers-reduced-motion:reduce){.stage[data-state="done"]{animation:none;background:#3a1416}}

/* laps */
#laps{
  width:100%;max-height:46%;overflow-y:auto;flex:0 0 auto;margin-top:10px;
  background:rgba(11,15,20,.55);border-top:1px solid var(--line);border-radius:8px;
  font-family:ui-monospace,"Roboto Mono",Consolas,monospace;font-variant-numeric:tabular-nums;
  font-size:clamp(12px,3.4vw,16px);
}
#laps .lap{display:flex;justify-content:space-between;padding:7px 14px;border-bottom:1px solid #1b242e}
#laps .lap span{color:var(--dim)}
#laps .lap b{font-weight:700}
#laps .lap i{color:var(--dim);font-style:normal}

/* ---------- action buttons ---------- */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:16px;grid-row:4}
.btn{
  border:0;border-radius:16px;cursor:pointer;color:#04150a;
  height:clamp(92px,16vh,168px);
  font:800 clamp(20px,6.4vw,34px)/1.05 inherit;letter-spacing:.06em;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
}
.btn small{font:600 clamp(10px,2.7vw,13px)/1 inherit;letter-spacing:.14em;opacity:.72;text-transform:uppercase}
.btn:active{filter:brightness(.86)}
.btn[disabled]{opacity:.3}
#go{background:var(--green)}
#go[data-act="pause"]{background:var(--amber)}
#alt{background:var(--cyan);color:#04202e}

/* ---------- custom keypad ---------- */
#pad{
  position:fixed;inset:0;z-index:20;background:rgba(6,9,13,.96);
  display:none;flex-direction:column;
  padding:calc(14px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
  gap:12px;
}
#pad[data-open="1"]{display:flex}
#padTitle{font:600 clamp(11px,3vw,14px)/1 inherit;letter-spacing:.22em;color:var(--dim);text-align:center}
#padVal{
  font-family:ui-monospace,"Roboto Mono",Consolas,monospace;font-variant-numeric:tabular-nums;
  font-weight:700;font-size:min(20vw,13vh);text-align:center;line-height:1;color:var(--text);
}
#padVal .off{color:#41505f}
#padGrid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:10px;min-height:0}
.key{
  border:0;border-radius:14px;background:var(--panel);color:var(--text);
  font:700 clamp(22px,7vw,34px)/1 inherit;cursor:pointer;box-shadow:inset 0 0 0 1px var(--line);
}
.key:active{filter:brightness(1.4)}
.key.fn{font-size:clamp(16px,4.6vw,22px);color:var(--dim)}
#padActions{display:grid;grid-template-columns:1fr 1.4fr;gap:12px}
#padCancel{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
#padSet{background:var(--cyan);color:#04202e}
#padActions .btn{height:clamp(64px,10vh,96px);font-size:clamp(17px,5vw,26px)}

/* ---------- landscape ---------- */
@media (orientation:landscape) and (max-height:560px){
  #app{grid-template-columns:1.0fr 1.15fr;grid-template-rows:auto 1fr auto;gap:8px}
  .head{grid-column:1/3;grid-row:1}
  #presets{grid-column:1;grid-row:2;align-content:start;gap:6px}
  .preset{padding:clamp(8px,2vh,14px) 2px;font-size:clamp(14px,3vw,20px)}
  .stage{grid-column:2;grid-row:2}
  .actions{grid-column:1/3;grid-row:3}
  .btn{height:clamp(62px,19vh,110px)}
  .digits{font-size:min(16vw,26vh)}
  body[data-mode="stopwatch"] #app{grid-template-columns:1fr}
  body[data-mode="stopwatch"] .head,
  body[data-mode="stopwatch"] .stage,
  body[data-mode="stopwatch"] .actions{grid-column:1}
  #padGrid{grid-template-columns:repeat(6,1fr)}
  #padVal{font-size:min(12vw,16vh)}
}
body[data-mode="stopwatch"] #presets{display:none}
body[data-mode="timer"] #laps{display:none}
body[data-mode="stopwatch"] .bar{display:none}
</style>
</head>
<body data-mode="timer">
<div id="app">

  <div class="head">
    <div class="tabs" role="tablist">
      <button class="tab" id="tabTimer" role="tab" aria-selected="true">TIMER</button>
      <button class="tab" id="tabSw" role="tab" aria-selected="false">STOPWATCH</button>
    </div>
    <button class="tog" id="togSound" data-on="1" aria-label="Toggle sound" aria-pressed="true">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9v6h4l5 4V5L8 9H4z"/>
        <path class="on-only" d="M16.5 8.5a5 5 0 0 1 0 7"/>
        <path class="on-only" d="M19.5 5.5a9 9 0 0 1 0 13"/>
        <path class="off-only" d="M17 9.5l5 5M22 9.5l-5 5"/>
      </svg>
    </button>
    <button class="tog" id="togVibe" data-on="1" aria-label="Toggle vibration" aria-pressed="true">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="8" y="3" width="8" height="18" rx="2"/>
        <path class="on-only" d="M4.5 9v6M2 10.5v3M19.5 9v6M22 10.5v3"/>
        <path class="off-only" d="M3.5 3.5l17 17"/>
      </svg>
    </button>
  </div>

  <div id="presets"></div>

  <div class="stage" id="stage">
    <div class="label" id="stageLabel">READY</div>
    <div class="digits" id="digits">0:35</div>
    <div class="bar"><i id="barFill"></i></div>
    <div id="laps"></div>
  </div>

  <div class="actions">
    <button class="btn" id="go">START</button>
    <button class="btn" id="alt">RESET<small>restarts &amp; runs</small></button>
  </div>

</div>

<div id="pad" data-open="0" role="dialog" aria-modal="true" aria-label="Custom time">
  <div id="padTitle">CUSTOM &nbsp;&#183;&nbsp; MIN : SEC</div>
  <div id="padVal">00:00</div>
  <div id="padGrid"></div>
  <div id="padActions">
    <button class="btn" id="padCancel">CANCEL</button>
    <button class="btn" id="padSet">SET &amp; START</button>
  </div>
</div>

<script>
(function(){
"use strict";

var PRESETS = [35,45,60,300,600,1200,1800,3600];
var DEFAULT_SEC = 35;

function $(id){ return document.getElementById(id); }
var elPresets=$("presets"), elDigits=$("digits"), elStage=$("stage"), elLabel=$("stageLabel"),
    elBar=$("barFill"), elGo=$("go"), elAlt=$("alt"), elLaps=$("laps"),
    tabTimer=$("tabTimer"), tabSw=$("tabSw"), togSound=$("togSound"), togVibe=$("togVibe"),
    elPad=$("pad"), elPadVal=$("padVal"), elPadGrid=$("padGrid"),
    elPadCancel=$("padCancel"), elPadSet=$("padSet");

var S = {
  mode:"timer",
  presetSec:DEFAULT_SEC,
  customSec:0,
  remainMs:DEFAULT_SEC*1000,
  endsAt:0,
  running:false,
  finished:false,
  swRunning:false,
  swBase:0,
  swElapsed:0,
  laps:[],
  sound:true,
  vibe:true
};

/* ---------- prefs (never the selected preset: launch is ALWAYS 35s) ---------- */
try{
  var p = JSON.parse(localStorage.getItem("mt.prefs")||"{}");
  if(typeof p.sound==="boolean") S.sound=p.sound;
  if(typeof p.vibe==="boolean") S.vibe=p.vibe;
  if(typeof p.customSec==="number" && p.customSec>0 && p.customSec<=36000) S.customSec=p.customSec;
}catch(e){}
function savePrefs(){
  try{ localStorage.setItem("mt.prefs", JSON.stringify({sound:S.sound,vibe:S.vibe,customSec:S.customSec})); }catch(e){}
}

/* ---------- audio ---------- */
var ac=null, scheduled=[];
function audio(){
  if(!ac){
    var C = window.AudioContext || window.webkitAudioContext;
    if(!C) return null;
    try{ ac = new C(); }catch(e){ return null; }
  }
  if(ac.state==="suspended"){ try{ ac.resume(); }catch(e){} }
  return ac;
}
/* Pleasant, not piercing: sine partials with a soft attack and a natural
   exponential decay - a struck-bell character rather than a buzzer. */
function tone(when, freq, dur, vol){
  var c=audio(); if(!c || !S.sound) return;
  var o=c.createOscillator(), g=c.createGain();
  o.type="sine";
  o.frequency.setValueAtTime(freq, when);
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(vol, when+0.014);   /* soft attack, no click */
  g.gain.exponentialRampToValueAtTime(0.0001, when+dur);  /* ring out */
  o.connect(g); g.connect(c.destination);
  o.start(when); o.stop(when+dur+0.03);
  scheduled.push(o);
}
function bell(when, freq, dur, vol){
  tone(when, freq,        dur,       vol);
  tone(when, freq*2,      dur*0.55,  vol*0.15);   /* shimmer */
  tone(when, freq*2.997,  dur*0.30,  vol*0.05);   /* faint air */
}

/* C major, one octave up: warm, resolves, still cuts through a loud gym */
var C6=1046.50, E6=1318.51, G6=1567.98, G5=783.99, E5=659.25, C5=523.25, B5=987.77;

function clearScheduled(){
  for(var i=0;i<scheduled.length;i++){ try{ scheduled[i].stop(0); scheduled[i].disconnect(); }catch(e){} }
  scheduled=[];
}
function now(){ var c=audio(); return c ? c.currentTime+0.01 : 0; }

function sfxGo(){    bell(now(), E5,  0.45, 0.22); }
function sfxStop(){  bell(now(), C5,  0.40, 0.18); }
function sfxLap(){   bell(now(), B5,  0.28, 0.16); }
function sfxPick(){  bell(now(), G5,  0.26, 0.15); }
function sfxKey(){   tone(now(), C6,  0.09, 0.06); }

/* the finish chime: an arpeggio that lands on a full triad, rung twice */
function chimeAt(t){
  bell(t,        C6, 0.90, 0.30);
  bell(t+0.17,   E6, 0.90, 0.30);
  bell(t+0.34,   G6, 1.50, 0.34);
  bell(t+1.05,   C6, 1.80, 0.26);
  bell(t+1.05,   E6, 1.80, 0.24);
  bell(t+1.05,   G6, 2.00, 0.28);
}

/* 3-2-1 ticks and the finish chime are scheduled on the audio clock so they
   still fire if Chrome backgrounds the tab or the screen goes off mid-set */
function scheduleCues(msLeft){
  var c=audio(); if(!c||!S.sound) return;
  var t0=c.currentTime, end=t0+msLeft/1000;
  for(var n=3;n>=1;n--){
    var t=end-n;
    if(t>t0+0.05) bell(t, G5, 0.30, 0.17);
  }
  if(end>t0+0.05) chimeAt(end);
}
function vibrate(pat){
  if(!S.vibe || !navigator.vibrate) return;
  try{ navigator.vibrate(pat); }catch(e){}
}

/* ---------- wake lock ---------- */
var wl=null;
function wakeOn(){
  if(!("wakeLock" in navigator) || wl) return;
  navigator.wakeLock.request("screen").then(function(s){
    wl=s; s.addEventListener("release", function(){ wl=null; });
  }).catch(function(){});
}
function wakeOff(){ if(wl){ try{ wl.release(); }catch(e){} wl=null; } }
function wakeSync(){ if(S.running||S.swRunning) wakeOn(); else wakeOff(); }
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState==="visible"){ wakeSync(); paint(); loopOn(); }
});

/* ---------- formatting ---------- */
function pad2(n){ return (n<10?"0":"")+n; }
function fmtClock(sec){
  sec=Math.max(0,sec);
  var h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=Math.floor(sec%60);
  if(h>0) return h+":"+pad2(m)+":"+pad2(s);
  return m+":"+pad2(s);
}
function fmtSw(ms){
  ms=Math.max(0,ms);
  var h=Math.floor(ms/3600000), m=Math.floor(ms%3600000/60000),
      s=Math.floor(ms%60000/1000), cs=Math.floor(ms%1000/10);
  var base=pad2(m)+":"+pad2(s)+"."+pad2(cs);
  return h>0 ? h+":"+base : base;
}
function presetLabel(sec){
  if(sec<60) return sec+"s";
  if(sec%60===0) return (sec/60)+"m";
  return Math.floor(sec/60)+"m"+pad2(sec%60);
}

/* ---------- preset buttons ---------- */
var presetBtns=[];
PRESETS.forEach(function(sec){
  var b=document.createElement("button");
  b.className="preset"; b.type="button"; b.textContent=presetLabel(sec);
  b.setAttribute("aria-label", presetLabel(sec)+" timer");
  b.addEventListener("click", function(){
    if(S.running) return;            /* locked mid-set: a stray tap can't kill a live timer */
    audio();
    selectPreset(sec);
    sfxPick();
  });
  presetBtns.push(b);
  elPresets.appendChild(b);
});
var btnCustom=document.createElement("button");
btnCustom.className="preset custom"; btnCustom.type="button";
btnCustom.setAttribute("aria-label","Custom time");
btnCustom.addEventListener("click", function(){
  if(S.running) return;
  audio();
  openPad();
});
elPresets.appendChild(btnCustom);

function selectPreset(sec){
  S.presetSec=sec; S.remainMs=sec*1000; S.finished=false; S.running=false;
  clearScheduled(); clearFinishTimer();
  syncPresets(); paint();
}
function syncPresets(){
  for(var i=0;i<presetBtns.length;i++){
    presetBtns[i].setAttribute("aria-pressed", PRESETS[i]===S.presetSec ? "true":"false");
  }
  var isCustom = PRESETS.indexOf(S.presetSec)===-1;
  btnCustom.textContent = isCustom ? presetLabel(S.presetSec)
                        : (S.customSec ? presetLabel(S.customSec)+" ✎" : "CUSTOM");
  btnCustom.setAttribute("aria-pressed", isCustom ? "true":"false");
  elPresets.setAttribute("data-locked", S.running ? "1":"0");
}

/* ---------- custom keypad ---------- */
var padDigits="";
var KEYS=["1","2","3","4","5","6","7","8","9","CLR","0","DEL"];
KEYS.forEach(function(k){
  var b=document.createElement("button");
  b.type="button";
  b.className = (k==="CLR"||k==="DEL") ? "key fn" : "key";
  b.textContent = k==="DEL" ? "⌫" : k;
  b.addEventListener("click", function(){
    if(k==="CLR") padDigits="";
    else if(k==="DEL") padDigits=padDigits.slice(0,-1);
    else if(padDigits.length<4) padDigits=(padDigits+k).replace(/^0+(?=\d)/,"");
    sfxKey(); vibrate(15);
    paintPad();
  });
  elPadGrid.appendChild(b);
});
function padSeconds(){
  var d=padDigits.padStart(4,"0");
  var m=parseInt(d.slice(0,2),10), s=parseInt(d.slice(2),10);
  return m*60+s;
}
function paintPad(){
  var d=padDigits.padStart(4,"0");
  var lead=4-padDigits.length;
  var html="";
  for(var i=0;i<4;i++){
    if(i===2) html+='<span class="'+(lead>2?"off":"")+'">:</span>';
    html+='<span class="'+(i<lead?"off":"")+'">'+d[i]+'</span>';
  }
  elPadVal.innerHTML=html;
  var sec=padSeconds();
  elPadSet.disabled = (sec<=0);
}
function openPad(){
  padDigits = S.customSec ? String(Math.floor(S.customSec/60))+pad2(S.customSec%60) : "";
  if(padDigits) padDigits=padDigits.replace(/^0+(?=\d)/,"").slice(-4);
  paintPad();
  elPad.setAttribute("data-open","1");
}
function closePad(){ elPad.setAttribute("data-open","0"); }
elPadCancel.addEventListener("click", function(){ closePad(); vibrate(20); });
elPadSet.addEventListener("click", function(){
  var sec=padSeconds();
  if(sec<=0) return;
  S.customSec=sec; savePrefs();
  closePad();
  selectPreset(sec);
  timerReset();                       /* SET & START — same one-tap intent as RESET */
});

/* ---------- timer ---------- */
var finishTimer=null;
function clearFinishTimer(){ if(finishTimer){ clearTimeout(finishTimer); finishTimer=null; } }

function timerStart(){
  if(S.remainMs<=0) return;
  audio();
  S.endsAt=Date.now()+S.remainMs;
  S.running=true; S.finished=false;
  clearScheduled(); scheduleCues(S.remainMs);
  clearFinishTimer();
  finishTimer=setTimeout(timerFinish, S.remainMs);
  sfxGo(); vibrate(60);
  wakeSync(); syncPresets(); paint(); loopOn();
}
function timerPause(){
  if(!S.running) return;
  loopOff();
  S.remainMs=Math.max(0, S.endsAt-Date.now());
  S.running=false;
  clearScheduled(); clearFinishTimer();
  wakeSync(); syncPresets(); paint();
}
function timerFinish(){
  loopOff(); clearFinishTimer();
  S.running=false; S.remainMs=0; S.finished=true;
  vibrate([300,120,300,120,500]);
  wakeSync(); syncPresets(); paint();
}
/* RESET reloads the selected preset AND starts it — back-to-back sets, one tap */
function timerReset(){
  loopOff(); clearScheduled(); clearFinishTimer();
  S.remainMs=S.presetSec*1000;
  S.finished=false; S.running=false;
  timerStart();
}

/* ---------- stopwatch ---------- */
function swStart(){ audio(); S.swBase=Date.now()-S.swElapsed; S.swRunning=true; sfxGo(); vibrate(50); wakeSync(); paint(); loopOn(); }
function swStop(){ loopOff(); S.swElapsed=Date.now()-S.swBase; S.swRunning=false; sfxStop(); vibrate(40); wakeSync(); paint(); }
function swReset(){ loopOff(); S.swRunning=false; S.swElapsed=0; S.laps=[]; wakeSync(); renderLaps(); paint(); }
function swLap(){
  var t = S.swRunning ? Date.now()-S.swBase : S.swElapsed;
  var prev = S.laps.length ? S.laps[0].total : 0;
  S.laps.unshift({ n:S.laps.length+1, total:t, split:t-prev });
  sfxLap(); vibrate(30);
  renderLaps();
}
function renderLaps(){
  var h="";
  for(var i=0;i<S.laps.length;i++){
    var L=S.laps[i];
    h+='<div class="lap"><span>LAP '+L.n+'</span><b>'+fmtSw(L.split)+'</b><i>'+fmtSw(L.total)+'</i></div>';
  }
  elLaps.innerHTML=h;
}

/* ---------- controls ---------- */
elGo.addEventListener("click", function(){
  if(S.mode==="timer"){
    if(S.finished) timerReset();
    else if(S.running) timerPause();
    else timerStart();
  }else{
    if(S.swRunning) swStop(); else swStart();
  }
});
elAlt.addEventListener("click", function(){
  if(S.mode==="timer") timerReset();
  else { if(S.swRunning) swLap(); else swReset(); }
});

function setMode(m){
  S.mode=m;
  document.body.setAttribute("data-mode",m);
  tabTimer.setAttribute("aria-selected", m==="timer"?"true":"false");
  tabSw.setAttribute("aria-selected", m==="stopwatch"?"true":"false");
  paint(); loopOn();
}
tabTimer.addEventListener("click", function(){ audio(); setMode("timer"); });
tabSw.addEventListener("click", function(){ audio(); setMode("stopwatch"); });

function syncTog(el,on){ el.setAttribute("data-on", on?"1":"0"); el.setAttribute("aria-pressed", on?"true":"false"); }
togSound.addEventListener("click", function(){
  S.sound=!S.sound; syncTog(togSound,S.sound); savePrefs();
  clearScheduled();
  if(S.sound){ audio(); sfxPick(); if(S.running) scheduleCues(Math.max(0,S.endsAt-Date.now())); }
});
togVibe.addEventListener("click", function(){
  S.vibe=!S.vibe; syncTog(togVibe,S.vibe); savePrefs();
  if(S.vibe) vibrate(80);
});
syncTog(togSound,S.sound);
syncTog(togVibe,S.vibe);

document.addEventListener("keydown", function(e){
  if(elPad.getAttribute("data-open")==="1"){
    if(e.key>="0"&&e.key<="9"){ e.preventDefault(); if(padDigits.length<4){ padDigits=(padDigits+e.key).replace(/^0+(?=\d)/,""); paintPad(); } }
    else if(e.key==="Backspace"){ e.preventDefault(); padDigits=padDigits.slice(0,-1); paintPad(); }
    else if(e.key==="Enter"){ e.preventDefault(); elPadSet.click(); }
    else if(e.key==="Escape"){ e.preventDefault(); closePad(); }
    return;
  }
  if(e.code==="Space"){ e.preventDefault(); elGo.click(); }
  else if(e.code==="KeyR"){ e.preventDefault(); elAlt.click(); }
});

/* ---------- render ---------- */
var lastFitLen=-1;
function fitDigits(text){
  var n=text.length;
  if(n===lastFitLen) return;
  lastFitLen=n;
  elDigits.style.fontSize = "min("+Math.min(33, 140/n).toFixed(1)+"vw, 29vh)";
}
function paint(){
  if(S.mode==="timer"){
    var ms = S.running ? Math.max(0, S.endsAt-Date.now()) : S.remainMs;
    elDigits.className="digits";
    elDigits.textContent=fmtClock(Math.ceil(ms/1000));
    fitDigits(elDigits.textContent);
    elBar.style.transform="scaleX("+(S.presetSec>0 ? Math.max(0,Math.min(1, ms/(S.presetSec*1000))) : 0)+")";

    var st="ready";
    if(S.finished) st="done";
    else if(S.running) st = (ms<=10000 ? "warn" : "run");
    else if(ms < S.presetSec*1000) st="paused";
    elStage.setAttribute("data-state", st);
    elLabel.textContent = st==="done" ? "TIME"
                        : st==="run"  ? "RUNNING"
                        : st==="warn" ? "FINISH IT"
                        : st==="paused" ? "PAUSED"
                        : "READY · "+presetLabel(S.presetSec);

    if(S.finished){ elGo.textContent="GO AGAIN"; elGo.setAttribute("data-act","start"); }
    else if(S.running){ elGo.textContent="PAUSE"; elGo.setAttribute("data-act","pause"); }
    else if(ms < S.presetSec*1000){ elGo.textContent="RESUME"; elGo.setAttribute("data-act","start"); }
    else { elGo.textContent="START"; elGo.setAttribute("data-act","start"); }
    elAlt.innerHTML="RESET<small>restarts &amp; runs</small>";
    elGo.disabled=false; elAlt.disabled=false;
  }else{
    var e = S.swRunning ? (Date.now()-S.swBase) : S.swElapsed;
    elDigits.className="digits sw";
    elDigits.textContent=fmtSw(e);
    fitDigits(elDigits.textContent);
    elStage.setAttribute("data-state", S.swRunning ? "run" : (e>0?"paused":"ready"));
    elLabel.textContent = S.swRunning ? "RUNNING" : (e>0 ? "STOPPED" : "STOPWATCH");
    elBar.style.transform="scaleX(0)";
    elGo.textContent = S.swRunning ? "STOP" : (e>0 ? "RESUME" : "START");
    elGo.setAttribute("data-act", S.swRunning ? "pause" : "start");
    elAlt.innerHTML = S.swRunning ? "LAP" : "RESET";
    elAlt.disabled = (!S.swRunning && e===0 && S.laps.length===0);
  }
}

/* the tick only runs while something is actually counting, and no faster than the
   display can show: 100 ms for the timer (whole seconds), 40 ms for the stopwatch
   (hundredths). Idle costs nothing, and a 60 min timer does not burn the battery. */
var tickId=null;
function loopOff(){ if(tickId){ clearInterval(tickId); tickId=null; } }
function loopOn(){
  loopOff();
  if(!(S.running||S.swRunning)) return;
  tickId=setInterval(tick, S.mode==="stopwatch" ? 40 : 100);
}
function tick(){
  if(S.running && Date.now()>=S.endsAt){ timerFinish(); return; }
  if(!(S.running||S.swRunning)){ loopOff(); return; }
  paint();
}

syncPresets();
paintPad();
paint();

/* ---------- pwa ---------- */
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
})();
</script>
